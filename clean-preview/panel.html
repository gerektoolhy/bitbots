<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clean Preview</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <label class="search">
        <span>Filter</span>
        <input id="filter" type="search" placeholder="host, path, or type" />
      </label>
      <label class="check">
        <input id="images-only" type="checkbox" checked />
        Images only
      </label>
      <label class="check">
        <input id="strip-matching" type="checkbox" checked />
        Strip query on matching hosts
      </label>
      <button id="clear" type="button">Clear</button>
      <span id="count" class="count"></span>
    </header>
    <div class="layout">
      <ul id="list"></ul>
      <section id="detail" class="detail empty">
        <p class="placeholder">Select a request to preview it without its query string.</p>
      </section>
    </div>
    <footer>
      <label>
        Hosts to strip
        <input id="patterns" type="text" spellcheck="false" />
      </label>
      <span class="hint">Comma-separated suffixes, for example fbcdn.net, cdninstagram.com</span>
    </footer>
    <script src="panel.js"></script>
  </body>
</html>
